name: Fetch Poly Haven assets
on:
  push:
    paths: ['tools/fetch_assets.py', '.github/workflows/assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests numpy opencv-python-headless
      - run: python tools/fetch_assets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add assets
          git commit -m "Update Poly Haven assets" || echo "no changes"
          git push
