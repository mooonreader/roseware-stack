name: Fetch Sentinel-2 imagery
on:
  push:
    paths: ['tools/fetch_sat.py', '.github/workflows/sat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install rasterio numpy pillow requests
      - run: python tools/fetch_sat.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/sat
          git commit -m "Update Sentinel-2 imagery" || echo "no changes"
          git push
